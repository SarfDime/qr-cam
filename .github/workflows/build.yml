name: Build QR Camera APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate keystore
        run: |
          keytool -genkeypair \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=QRCam, OU=Dev, O=Personal, L=-, S=-, C=US"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build release APK
        env:
          KEYSTORE_PATH: ../debug.keystore
          KEYSTORE_PASSWORD: android
          KEY_ALIAS: androiddebugkey
          KEY_PASSWORD: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Get short commit SHA
        id: vars
        run: echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0-${{ steps.vars.outputs.sha }}
          name: "QR Camera ${{ steps.vars.outputs.sha }}"
          body: |
            Automated build from commit `${{ steps.vars.outputs.sha }}`.

            **Install:** download the APK below, enable *Install unknown apps*, tap to install.
            **Setup:** double-press power → pick *QR Camera* → *Always*.
          files: app/build/outputs/apk/release/app-release.apk
          make_latest: true
